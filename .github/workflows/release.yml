name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable
        run: pyinstaller oled_calibrator.spec

      - name: Create release zip
        run: |
          Compress-Archive -Path "dist/OLED TV Calibrator.exe" -DestinationPath "dist/OLED-TV-Calibrator-${{ github.ref_name }}.zip"
        shell: pwsh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/OLED TV Calibrator.exe
            dist/OLED-TV-Calibrator-${{ github.ref_name }}.zip
          generate_release_notes: true
          draft: false
          prerelease: false
